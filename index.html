<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riabilitazione Scapola</title>

  <!-- Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Stili base -->
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 1rem;
      background: #f5f5f5;
    }

    .card {
      background: white;
      padding: 1rem;
      margin-bottom: 1rem;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .exercise-title {
      font-weight: bold;
      margin-top: 1rem;
    }

    .exercise-desc {
      margin-bottom: 1rem;
      color: #444;
    }
  </style>
</head>

<body>

  <!-- TEST SETTIMANALE (visibile solo il lunedì) -->
  <div id="weekly-test" class="card">
    <h2>Test Settimanale</h2>
    <p>Effettua il test di valutazione della scapola.</p>
    <!-- Qui puoi mettere il contenuto del test -->
  </div>

  <!-- SEZIONE ESERCIZI GIORNALIERI -->
  <div class="card">
    <h2>Esercizi del giorno</h2>
    <p>Completa gli esercizi assegnati per oggi.</p>
    <!-- Qui rimane la tua logica degli esercizi giornalieri -->
  </div>

  <!-- LISTA COMPLETA ESERCIZI (compressa, in fondo) -->
  <div class="card" style="margin-top:2rem;">
    <div id="exercise-toggle" style="font-weight:600; cursor:pointer;">
      Lista completa esercizi ▼
    </div>

    <div id="exercise-list" style="display:none; margin-top:1rem;">
      <!-- 🔽 QUI DENTRO METTI LA TUA LISTA COMPLETA DEGLI ESERCIZI 🔽 -->

      <div class="exercise-title">Esercizio 1 – Nome esercizio</div>
      <div class="exercise-desc">Descrizione dell’esercizio…</div>

      <div class="exercise-title">Esercizio 2 – Nome esercizio</div>
      <div class="exercise-desc">Descrizione dell’esercizio…</div>

      <!-- Continua con tutti gli esercizi -->
    </div>
  </div>

  <!-- SCRIPT: mostra test solo il lunedì -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const today = new Date().getDay(); // 1 = lunedì
      const testSection = document.getElementById("weekly-test");

      if (today !== 1) {
        testSection.style.display = "none";
      }
    });
  </script>

  <!-- SCRIPT: lista esercizi comprimibile -->
  <script>
    document.getElementById("exercise-toggle").addEventListener("click", () => {
      const list = document.getElementById("exercise-list");
      const toggle = document.getElementById("exercise-toggle");

      if (list.style.display === "none") {
        list.style.display = "block";
        toggle.innerHTML = "Lista completa esercizi ▲";
      } else {
        list.style.display = "none";
        toggle.innerHTML = "Lista completa esercizi ▼";
      }
    });
  </script>

  <!-- REGISTRAZIONE SERVICE WORKER -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js");
    }
  </script>

</body>
</html>
